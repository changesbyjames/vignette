services:
  vignette-host:
    build:
      context: ../..
      dockerfile: examples/kitchen-sink/Dockerfile.host
    ports:
      - "4173:4173"

  vignette-worker:
    build:
      context: ../..
      dockerfile: examples/kitchen-sink/Dockerfile.obs
    depends_on:
      vignette-host:
        condition: service_healthy
    environment:
      # The worker downloads assets through the runtime URL's host; OBS runs on the Docker host
      # and loads browser-source frames through the published port instead.
      VIGNETTE_RUNTIME_URL: http://vignette-host:4173/runtime
      VIGNETTE_BROWSER_SOURCE_BASE_URL: ${VIGNETTE_BROWSER_SOURCE_BASE_URL:-http://127.0.0.1:4173/}
      VIGNETTE_OBS_URL: ${VIGNETTE_OBS_URL:-ws://host.docker.internal:4455}
      VIGNETTE_OBS_PASSWORD: ${VIGNETTE_OBS_PASSWORD:-runtime-only}
    extra_hosts:
      - "host.docker.internal:host-gateway"
